# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 1]] # 0-P1/2

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [128, 3, 1]] # 2-P2/4
  - [-1, 2, C3k2_UIB, [128, False, 0.25]]

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [256, 3, 1]] # 5-P3/8
  - [-1, 2, C3k2_UIB, [256, False, 0.25]]

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [512, 3, 1]] # 8-P4/16
  - [-1, 2, C3k2_UIB, [512, True]]

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [1024, 3, 1]] # 11-P5/32
  - [-1, 2, C3k2_UIB, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14

# YOLO11n head
head:
  - [-1, 1, DySample, [2, 'lp']]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_UIB, [512, False]] # 17

  - [-1, 1, DySample, [2, 'lp']]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_UIB, [256, False]] # 20 (P3/8-small)

  - [-1, 1, DySample, [2, 'lp']]
  - [ [ -1, 3 ], 1, Concat, [ 1 ] ] # cat backbone P3
  - [ -1, 2, C3k2_UIB, [ 126, False ] ] # 23 (P3/8-small)

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [128, 3, 1]]
  - [[-1, 20], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_UIB, [256, False]] # 27 (P4/16-medium)

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [-1, 1, Conv, [256, 3, 1]]
  - [[-1, 17], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_UIB, [512, True]] # 31 (P5/32-large)

  - [ -1, 1, space_to_depth, [ 1 ] ]  # 2
  - [ -1, 1, Conv, [ 512, 3, 1 ] ]
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ] # cat head P5
  - [ -1, 2, C3k2_UIB, [ 1024, True ] ] # 35 (P5/32-large)

  - [[23, 27, 31, 35], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
